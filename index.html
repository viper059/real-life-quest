<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real-life Quest</title>
<meta name="description" content="รับเควสต์จริง ได้ Gold จริง เลเวลอัปจริง">
<meta name="theme-color" content="#3a2618">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RLQ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>

<!-- ===== Signed out ===== -->
<section id="authView" class="hidden">
  <div class="auth">
    <div class="card hidden" id="installCard" style="display:flex;align-items:center;gap:12px;margin-bottom:12px;background:var(--wood-800);border-color:var(--gold-500);color:var(--on-wood)">
      <img src="icons/icon-192.png" alt="" width="48" height="48" style="border-radius:12px;flex:none">
      <div style="flex:1;min-width:0"><b style="font-family:var(--font-display);font-weight:500">ติดตั้ง Real-life Quest</b>
        <div class="small" id="installHint" style="color:var(--on-wood-muted)">เปิดได้จากหน้าจอโฮมเหมือนแอปทั่วไป</div></div>
      <button class="btn primary" id="installBtn" type="button">ติดตั้ง</button>
    </div>
    <div class="card stack">
      <div><div class="brand">REAL-LIFE QUEST</div><p class="muted" style="margin:4px 0 0">รับเควสต์จริง ได้ Gold จริง เลเวลอัปจริง</p></div>
      <div class="row" role="tablist" aria-label="เข้าสู่ระบบหรือสมัคร">
        <button class="pill" role="tab" id="tabLogin" aria-pressed="true">เข้าสู่ระบบ</button>
        <button class="pill" role="tab" id="tabSignup" aria-pressed="false">สมัครนักผจญภัย</button>
      </div>
      <form id="authForm" class="stack">
        <label class="f hidden" id="usernameWrap">ชื่อผู้ใช้ (a–z, 0–9, _ 3–20 ตัว)
          <input id="authUsername" autocomplete="username" pattern="[A-Za-z0-9_]{3,20}">
        </label>
        <label class="f">อีเมล<input id="authEmail" type="email" required autocomplete="email"></label>
        <label class="f">รหัสผ่าน<input id="authPassword" type="password" required minlength="6" autocomplete="current-password"></label>
        <label class="row small hidden" id="termsWrap"><input type="checkbox" id="authTerms" style="width:20px;height:20px"> ยอมรับ <a href="terms.html" target="_blank">ข้อตกลงการใช้งาน</a> และ <a href="privacy.html" target="_blank">นโยบายความเป็นส่วนตัว</a></label>
        <button class="btn primary" id="authSubmit" type="submit">เข้าสู่ระบบ</button>
        <p id="authMsg" class="small muted" role="status" style="margin:0"></p>
      </form>
    </div>
    <p class="small muted center"><a href="terms.html">ข้อตกลงการใช้งาน</a> · <a href="privacy.html">นโยบายความเป็นส่วนตัว</a></p>
  </div>
</section>

<!-- ===== Signed in ===== -->
<div id="appView" class="hidden">
  <header class="top">
    <div class="top-in">
      <div class="lv" id="hLevel" aria-label="เลเวล">1</div>
      <div class="who"><b id="hName">…</b><span id="hSub">นักผจญภัย</span></div>
      <span class="chip g" title="Gold"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/></svg><span id="hGold">0</span></span>
      <span class="chip c" title="Crystal"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l7 6-7 12-7-12z"/><path d="M5 9h14"/></svg><span id="hCrystal">0</span></span>
      <button class="icon-btn bell" id="bellBtn" type="button" aria-label="การแจ้งเตือน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg><span class="badge hidden" id="bellCount">0</span></button>
      <button class="icon-btn hidden" id="installTop" type="button">ติดตั้งแอป</button>
      <button class="icon-btn" id="signOut" type="button">ออก</button>
    </div>
  </header>

  <nav class="tabs" aria-label="เมนูหลัก">
    <button data-tab="board" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>เควสต์</button>
    <button data-tab="char"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>ตัวละคร</button>
    <button data-tab="deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M9 3h10a2 2 0 0 1 2 2v13"/></svg>การ์ดอาชีพ</button>
    <button data-tab="guild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>กิลด์</button>
    <button data-tab="wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg>กระเป๋า</button>
  </nav>

  <main>
    <div id="kycBanner" class="card hidden kyc-banner"></div>

    <!-- Quests -->
    <section id="view-board">
      <div class="seg" role="tablist" aria-label="ส่วนของเควสต์">
        <button data-qsub="board" aria-pressed="true">กระดาน</button>
        <button data-qsub="mine" aria-pressed="false">งานของฉัน</button>
        <button data-qsub="plan" aria-pressed="false">แผนของฉัน</button>
      </div>
      <div id="qsub-board">
        <div class="row between" style="margin:14px 0 10px">
          <h1 style="font-size:24px">กระดานเควสต์</h1>
          <button class="btn primary" id="openPost" type="button">+ โพสต์เควสต์</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          <div class="seg small-seg" role="group" aria-label="มุมมอง">
            <button data-view="list" aria-pressed="true">รายการ</button>
            <button data-view="map" aria-pressed="false">แผนที่</button>
          </div>
          <button class="pill" id="nearBtn" type="button" aria-pressed="false">ใกล้ฉัน</button>
        </div>
        <div class="row scroll-x" id="catFilters" aria-label="กรองหมวด"></div>
        <div id="radar" class="radar hidden" aria-label="แผนที่เควสต์"></div>
        <div class="grid" id="boardList" style="margin-top:12px"></div>
      </div>
      <div id="qsub-mine" class="hidden"></div>
      <div id="qsub-plan" class="hidden"></div>
    </section>

    <section id="view-char" class="hidden"></section>
    <section id="view-deck" class="hidden">
      <div class="section"><h1 style="font-size:24px">การ์ดอาชีพ</h1><div id="deckPanel"></div></div>
      <div class="section"><h2 style="font-size:17px">คลังการ์ด</h2>
        <div class="grid" id="cardList" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"></div></div>
    </section>
    <section id="view-guild" class="hidden">
      <div class="section"><h1 style="font-size:24px">กิลด์</h1><div id="guildPanel"></div></div>
      <div class="section"><h2 style="font-size:19px">ครอบครัว</h2><div id="familyPanel"></div></div>
    </section>
    <section id="view-wallet" class="hidden"></section>
  </main>
</div>

<!-- Full-screen sheet for quest details, notifications, forms -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <div class="sheet-head"><h2 id="sheetTitle">…</h2><button class="icon-btn dark" id="sheetClose" type="button" aria-label="ปิด">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/quests.js"></script>
<script src="js/avatar.js"></script>
<script src="js/me.js"></script>
<script src="js/social.js"></script>
<script src="js/wallet.js"></script>
<script src="js/planner.js"></script>
<script>App.boot();</script>
</body>
</html>
