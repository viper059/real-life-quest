<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-life Quest · หลังบ้าน</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --wood-900:#2a1b11;--wood-800:#3a2618;--wood-700:#5a3d27;--wood-line:#8a6a3a;
  --parchment-100:#fbf3df;--parchment-200:#f3e6c8;--parchment-300:#f1e4c6;--parchment-track:#e6d5ae;--parchment-pin:#d8c39a;
  --brass-500:#c9a86a;--brass-600:#b0905a;
  --ink:#2a1e14;--ink-soft:#4a3726;--ink-muted:#6b5540;
  --on-wood:#fbf3df;--on-wood-muted:#d9c49c;--nav-idle:#c9b48f;
  --gold-500:#e8b13a;--gold-ink:#8a5a0b;
  --teal-600:#1f6f6b;--teal-tint:#e4efe9;--teal-ink:#1f5a45;
  --danger:#b3261e;--danger-tint:#f6e3da;--danger-ink:#8a3a0b;
  --font-display:"Mitr","IBM Plex Sans Thai",sans-serif;--font-body:"IBM Plex Sans Thai",system-ui,sans-serif;--font-rpg:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--parchment-300);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.3}
.hidden{display:none!important}
.top{background:var(--wood-800);border-bottom:3px solid var(--brass-500);color:var(--on-wood)}
.top-in{padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{font-family:var(--font-rpg);font-weight:700;color:var(--gold-500);font-size:18px}
.role-badge{font-size:13px;font-weight:600;color:var(--ink);background:var(--gold-500);border-radius:999px;padding:4px 12px}
.shell{display:flex;flex-wrap:wrap;min-height:calc(100vh - 62px)}
.side{flex:1 1 220px;background:var(--wood-900);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--on-wood-muted);text-align:left;cursor:pointer;font-size:14px}
.side button[aria-current="page"]{background:var(--wood-800);color:var(--gold-500);font-weight:600}
.side button:disabled{color:#a8927a;cursor:not-allowed}
.count{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--gold-500);color:var(--ink);font-weight:600}
.count.red{background:var(--danger);color:#fff}
.content{flex:999 1 560px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px;max-width:1240px}
.card{background:var(--parchment-100);border:1.5px solid var(--brass-500);border-radius:14px;padding:16px;box-shadow:0 2px 0 var(--parchment-pin)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi .v{font-family:var(--font-rpg);font-weight:700;font-size:28px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink-muted)}.small{font-size:12px}
.btn{font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;border:0;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--gold-500);color:var(--ink)}
.btn.action{background:var(--teal-600);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.sec{background:var(--parchment-100);color:var(--ink-soft);border:1.5px solid var(--brass-600)}
.btn:focus-visible,.side button:focus-visible,.pill:focus-visible,.cell:focus-visible{outline:3px solid var(--teal-600);outline-offset:2px}
.pill{border:1.5px solid var(--brass-600);background:var(--parchment-100);color:var(--ink-soft);border-radius:999px;min-height:38px;padding:0 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--wood-800);border-color:var(--wood-800);color:var(--on-wood);font-weight:600}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tbl-wrap{overflow-x:auto;background:var(--parchment-100);border:1.5px solid var(--brass-500);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-muted);font-weight:600;padding:12px 10px}
td{padding:10px;border-top:1px dashed var(--brass-500);vertical-align:top}
.gold{font-family:var(--font-rpg);font-weight:700;color:var(--gold-ink);white-space:nowrap}
.empty{padding:20px;text-align:center;color:var(--ink-muted);border:1.5px dashed var(--brass-600);border-radius:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--brass-600);border-radius:10px;padding:8px 10px;background:#fffdf6;color:var(--ink);min-height:40px}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split>.main{flex:999 1 480px;min-width:0}.split>.aside{flex:1 1 320px}
tr.sel td{background:var(--parchment-200)}
.cell{width:42px;height:42px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.cell.F{background:var(--teal-600);color:#fff;border:0}
.cell.V{background:var(--teal-tint);color:var(--teal-ink);border:1.5px solid var(--teal-600)}
.cell.N{background:var(--parchment-200);color:var(--ink-muted);border:1.5px dashed var(--brass-600)}
.cell:disabled{cursor:not-allowed;opacity:.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wood-900);color:var(--on-wood);border:1.5px solid var(--gold-500);border-radius:10px;padding:10px 16px;z-index:50;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--danger)}
.auth{max-width:400px;margin:60px auto;padding:0 16px}
</style>
</head>
<body>

<section id="authView" class="hidden">
  <div class="auth">
    <form id="loginForm" class="card" style="display:flex;flex-direction:column;gap:12px">
      <div><div class="brand">RLQ · หลังบ้าน</div><p class="muted small" style="margin:4px 0 0">สำหรับทีมงานเท่านั้น ใช้บัญชีเดียวกับแอป</p></div>
      <label class="f">อีเมล<input id="lEmail" type="email" required autocomplete="email"></label>
      <label class="f">รหัสผ่าน<input id="lPass" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit" id="lBtn">เข้าสู่ระบบ</button>
      <p id="lMsg" class="small muted" role="status" style="margin:0"></p>
    </form>
  </div>
</section>

<section id="deniedView" class="hidden">
  <div class="auth"><div class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:18px">บัญชีนี้ยังไม่มีสิทธิ์เข้าหลังบ้าน</h2>
    <p class="muted" style="margin:0">ให้เจ้าของระบบเพิ่มบทบาทให้ก่อน แล้วโหลดหน้านี้ใหม่</p>
    <button class="btn sec" id="deniedOut" type="button">ออกจากระบบ</button>
  </div></div>
</section>

<div id="appView" class="hidden">
  <header class="top"><div class="top-in">
    <span class="brand">RLQ</span><span style="font-family:var(--font-display);font-size:16px;flex:1">หลังบ้าน</span>
    <span class="role-badge" id="roleBadge">—</span>
    <span id="meName" class="small" style="color:var(--on-wood-muted)"></span>
    <button class="btn sec" id="signOut" type="button" style="min-height:34px">ออก</button>
  </div></header>
  <div class="shell">
    <nav class="side" id="side" aria-label="เมนูหลังบ้าน"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
(() => {
  const sb = window.supabase.createClient('https://hkujzoluicokvvwlnffd.supabase.co', 'sb_publishable_EqpS2q5qOoQfT0i3pFFgJQ_LKRJpKpN');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const when = (iso) => iso ? new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
  const ageDays = (iso) => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 86400000));
  const ERR = [['forbidden', 'บทบาทของคุณไม่มีสิทธิ์ทำสิ่งนี้'], ['second approval must come', 'ผู้อนุมัติคนที่ 2 ต้องเป็นคนละคนกับคนแรก'],
    ['cannot decide your own', 'อนุมัติคำขอของตัวเองไม่ได้'], ['owner permissions are locked', 'สิทธิ์ของเจ้าของระบบแก้ไม่ได้'],
    ['cannot remove the last owner', 'ต้องมีเจ้าของระบบอย่างน้อย 1 คน'], ['withdrawal not open', 'คำขอนี้ถูกตัดสินไปแล้ว'],
    ['bad rate', 'อัตราต้องเป็นตัวเลข เช่น 0.25'], ['fund too low', 'เงินในกองทุนไม่พอจ่าย'], ['claim not approved', 'เคลมนี้ถูกตัดสินไปแล้ว'], ['must be a whole number', 'ต้องเป็นจำนวนเต็ม'], ['Invalid login credentials', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง']];
  const errText = (e) => { const m = (e && e.message) || String(e); const h = ERR.find(([k]) => m.includes(k)); return h ? h[1] : m; };
  let tt; function toast(m, bad) { const t = $('toast'); t.textContent = m; t.classList.toggle('err', !!bad); t.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3400); }

  const CATS = { general: 'ทั่วไป', home: 'งานบ้าน', delivery: 'ส่งของ', tutor: 'สอนพิเศษ', repair: 'งานช่าง', family: 'ครอบครัว' };
  const WST = { pending: 'รออนุมัติ', second_approval: 'รอคนที่ 2', paid: 'โอนแล้ว', rejected: 'ปฏิเสธแล้ว' };
  const S = { user: null, role: null, roleLabel: '', perms: {}, page: 'overview', settings: {}, qTab: 'pending', selQuest: null };
  const can = (p, min = 'full') => S.perms[p] === 'full' || (min === 'view' && S.perms[p] === 'view');

  const PAGES = [
    { id: 'overview', label: 'ภาพรวม', need: null },
    { id: 'quests', label: 'ตรวจเควสต์', need: ['q.review', 'view'] },
    { id: 'reports', label: 'รายงาน', need: ['q.reports', 'view'] },
    { id: 'withdrawals', label: 'อนุมัติถอนเงิน', need: ['m.withdraw', 'view'] },
    { id: 'guilds', label: 'กิลด์และกองทุน', need: ['g.fund', 'view'] },
    { id: 'settings', label: 'เศรษฐกิจ · อัตรา Gold', need: ['m.rate', 'view'] },
    { id: 'staff', label: 'ทีมงาน', need: ['s.roles', 'view'] },
    { id: 'roles', label: 'บทบาทและสิทธิ์', need: ['s.roles', 'view'] },
    { id: 'audit', label: 'บันทึกการตรวจสอบ', need: ['s.audit', 'view'] }
  ];
  const allowed = (pg) => !pg.need || can(pg.need[0], pg.need[1]);

  async function rpc(fn, args, ok) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) { toast(errText(error), true); return null; }
    if (ok) toast(typeof ok === 'function' ? ok(data) : ok);
    return data ?? true;
  }

  /* ---------- Boot ---------- */
  async function boot(user) {
    S.user = user;
    const { data: me } = await sb.from('staff_members').select('role_id, role:staff_roles(label), profile:profiles!staff_members_user_id_fkey(username,display_name)').eq('user_id', user.id).maybeSingle();
    if (!me) { show('denied'); return; }
    S.role = me.role_id; S.roleLabel = me.role ? me.role.label : me.role_id;
    const { data: rp } = await sb.from('role_permissions').select('permission_id, level').eq('role_id', S.role);
    S.perms = Object.fromEntries((rp || []).map((r) => [r.permission_id, r.level]));
    const { data: st } = await sb.from('app_settings').select('key,value');
    S.settings = Object.fromEntries((st || []).map((r) => [r.key, r.value]));
    $('roleBadge').textContent = S.roleLabel;
    $('meName').textContent = me.profile ? (me.profile.display_name || '@' + me.profile.username) : '';
    show('app'); go('overview');
  }
  function show(which) { ['auth', 'denied', 'app'].forEach((v) => $(v + 'View').classList.toggle('hidden', v !== which)); }
  sb.auth.onAuthStateChange((_e, session) => {
    const u = session && session.user;
    if (u && (!S.user || S.user.id !== u.id)) setTimeout(() => boot(u), 0);
    if (!u) { S.user = null; show('auth'); }
  });
  $('loginForm').onsubmit = async (ev) => {
    ev.preventDefault(); $('lBtn').disabled = true; $('lMsg').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
    $('lBtn').disabled = false; if (error) $('lMsg').textContent = errText(error);
  };
  $('signOut').onclick = $('deniedOut').onclick = () => sb.auth.signOut();

  /* ---------- Nav ---------- */
  async function counts() {
    const c = {};
    const head = (q) => q.then((r) => r.count || 0);
    if (can('q.review', 'view')) c.quests = await head(sb.from('quests').select('id', { count: 'exact', head: true }).eq('moderation', 'pending').neq('status', 'suspended'));
    if (can('q.reports', 'view')) c.reports = await head(sb.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open'));
    if (can('m.withdraw', 'view')) c.withdrawals = await head(sb.from('withdrawals').select('id', { count: 'exact', head: true }).in('status', ['pending', 'second_approval']));
    if (can('g.fund', 'view')) c.guilds = await head(sb.from('guild_claims').select('id', { count: 'exact', head: true }).eq('status', 'approved'));
    return c;
  }
  async function renderSide() {
    const c = await counts(); S.counts = c;
    $('side').innerHTML = PAGES.map((p) => {
      const ok = allowed(p), n = c[p.id];
      return `<button data-page="${p.id}" ${ok ? '' : 'disabled aria-disabled="true"'} aria-current="${S.page === p.id ? 'page' : 'false'}">
        <span>${p.label}</span>${!ok ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="ไม่มีสิทธิ์"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>' : n ? `<span class="count ${p.id === 'quests' ? 'red' : ''}">${n}</span>` : ''}</button>`;
    }).join('');
  }
  $('side').onclick = (ev) => { const b = ev.target.closest('button[data-page]'); if (b && !b.disabled) go(b.dataset.page); };
  async function go(page) {
    S.page = page; await renderSide();
    $('content').innerHTML = '<p class="muted">กำลังโหลด…</p>';
    try { await VIEWS[page](); } catch (e) { $('content').innerHTML = `<div class="empty">${esc(errText(e))}</div>`; }
  }
  const reload = () => go(S.page);

  /* ---------- Views ---------- */
  const VIEWS = {};

  VIEWS.overview = async () => {
    const c = S.counts || {};
    const cards = [];
    if ('quests' in c) cards.push(['เควสต์รอตรวจ', c.quests, 'quests']);
    if ('reports' in c) cards.push(['รายงานที่ยังเปิด', c.reports, 'reports']);
    if ('withdrawals' in c) cards.push(['คำขอถอนรอตัดสิน', c.withdrawals, 'withdrawals']);
    if ('guilds' in c) cards.push(['เคลมกองทุนรอจ่าย', c.guilds, 'guilds']);
    if (can('m.ledger', 'view')) {
      const { data } = await sb.from('wallets').select('gold, gold_locked');
      const tot = (data || []).reduce((a, w) => a + Number(w.gold) + Number(w.gold_locked), 0);
      cards.push(['Gold ทั้งระบบ', num(tot), null]);
    }
    const { count: users } = await sb.from('profiles').select('id', { count: 'exact', head: true });
    cards.push(['ผู้ใช้ทั้งหมด', num(users), null]);
    $('content').innerHTML = `
      <div><h1 style="font-size:28px">ภาพรวม</h1><p class="muted" style="margin:4px 0 0">คุณเข้าในฐานะ ${esc(S.roleLabel)} — เมนูที่มีรูปกุญแจคือส่วนที่บทบาทนี้ไม่มีสิทธิ์</p></div>
      <div class="kpis">${cards.map(([l, v, p]) => `<div class="card kpi"><div class="small muted">${l}</div><div class="v">${v}</div>${p ? `<button class="btn sec" data-go="${p}" style="margin-top:6px">เปิด</button>` : ''}</div>`).join('')}</div>`;
  };

  VIEWS.quests = async () => {
    const pending = S.qTab === 'pending';
    let rows = [];
    if (pending) {
      const { data, error } = await sb.from('quests').select('*, poster:profiles!quests_poster_id_fkey(username,quests_done,created_at)')
        .eq('moderation', 'pending').neq('status', 'suspended').order('created_at');
      if (error) throw error; rows = data;
    } else {
      const { data, error } = await sb.from('quests').select('*, poster:profiles!quests_poster_id_fkey(username,quests_done,created_at)')
        .eq('moderation', 'changes_requested').order('updated_at', { ascending: false }).limit(50);
      if (error) throw error; rows = data;
    }
    const sel = rows.find((q) => q.id === S.selQuest) || rows[0];
    S.selQuest = sel ? sel.id : null;
    const editable = can('q.review');
    $('content').innerHTML = `
      <div class="row between"><h1 style="font-size:28px">ตรวจเควสต์</h1>
        <div class="row"><button class="pill" data-qtab="pending" aria-pressed="${pending}">รอตรวจ</button><button class="pill" data-qtab="changes" aria-pressed="${!pending}">ขอให้แก้ไขแล้ว</button></div></div>
      ${rows.length ? `<div class="split">
        <div class="main tbl-wrap"><table style="min-width:560px"><thead><tr><th>เควสต์</th><th>หมวด</th><th style="text-align:right">รางวัล</th><th>โพสต์เมื่อ</th></tr></thead><tbody>
          ${rows.map((q) => `<tr class="${q.id === S.selQuest ? 'sel' : ''}"><td><button class="btn sec" data-pick="${q.id}" style="min-height:0;padding:4px 8px;border:0;background:none;text-align:left"><b>${esc(q.title)}</b><br><span class="small muted">@${esc(q.poster && q.poster.username)}</span></button></td>
            <td>${esc(CATS[q.category] || q.category)}</td><td class="gold" style="text-align:right">${num(q.reward_gold)} G</td><td class="small muted">${when(q.created_at)}</td></tr>`).join('')}
        </tbody></table></div>
        ${sel ? `<aside class="aside card" style="border:2px solid var(--wood-800);display:flex;flex-direction:column;gap:10px" aria-label="รายละเอียดเควสต์">
          <div class="row"><span class="tag" style="background:var(--parchment-200);color:var(--ink-soft)">RANK ${esc(sel.rank)}</span><span class="tag" style="background:var(--danger-tint);color:var(--danger-ink)">${sel.urgent_until ? 'ด่วน' : 'ปกติ'}</span></div>
          <h2 style="font-size:19px">${esc(sel.title)}</h2>
          <p style="margin:0;white-space:pre-line;color:var(--ink-soft)">${esc(sel.description || '— ไม่มีรายละเอียด —')}</p>
          <dl style="margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:13px">
            <div><dt class="muted">ผู้โพสต์</dt><dd style="margin:0;font-weight:600">@${esc(sel.poster && sel.poster.username)}</dd></div>
            <div><dt class="muted">รางวัล</dt><dd style="margin:0;font-weight:600">${num(sel.reward_gold)} G · ${num(sel.reward_exp)} EXP</dd></div>
            <div><dt class="muted">อายุบัญชี</dt><dd style="margin:0;font-weight:600">${sel.poster ? ageDays(sel.poster.created_at) + ' วัน' : '—'}</dd></div>
            <div><dt class="muted">เควสต์ที่ทำสำเร็จ</dt><dd style="margin:0;font-weight:600">${sel.poster ? num(sel.poster.quests_done) : '—'}</dd></div>
          </dl>
          ${sel.moderation_note ? `<p class="small" style="margin:0;color:var(--danger-ink)">หมายเหตุเดิม: ${esc(sel.moderation_note)}</p>` : ''}
          ${editable ? `<label class="f">หมายเหตุถึงผู้โพสต์<textarea id="modNote" rows="3"></textarea></label>
          <div class="row"><button class="btn action" data-mod="approve" style="flex:1">อนุมัติ</button><button class="btn sec" data-mod="changes" style="flex:1">ขอให้แก้ไข</button><button class="btn danger" data-mod="suspend" style="flex:1">ระงับ</button></div>
          <p class="small muted" style="margin:0">ระงับแล้ว Gold ที่ล็อกไว้คืนผู้โพสต์อัตโนมัติ · ทุกการตัดสินถูกบันทึก</p>` : '<p class="small muted" style="margin:0">บทบาทของคุณดูได้อย่างเดียว</p>'}
        </aside>` : ''}
      </div>` : `<div class="empty">${pending ? 'ไม่มีเควสต์รอตรวจ' : 'ไม่มีเควสต์ที่ขอให้แก้ไข'}</div>`}`;
  };

  VIEWS.reports = async () => {
    const { data, error } = await sb.from('reports').select('*, quest:quests(id,title,status,moderation), reporter:profiles!reports_reporter_id_fkey(username)').eq('status', 'open').order('created_at');
    if (error) throw error;
    $('content').innerHTML = `<h1 style="font-size:28px">รายงานจากผู้ใช้</h1>
      ${data.length ? `<div class="tbl-wrap"><table style="min-width:620px"><thead><tr><th>เควสต์</th><th>เหตุผล</th><th>ผู้รายงาน</th><th>เมื่อ</th><th></th></tr></thead><tbody>
      ${data.map((r) => `<tr><td><b>${esc(r.quest && r.quest.title)}</b><br><span class="small muted">${esc(r.quest && r.quest.status)}</span></td><td>${esc(r.reason)}</td><td>@${esc(r.reporter && r.reporter.username)}</td><td class="small muted">${when(r.created_at)}</td>
        <td style="text-align:right">${can('q.reports') ? `<button class="btn sec" data-resolve="${r.id}">ปิดเคส</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ไม่มีรายงานที่ค้างอยู่</div>'}`;
  };

  VIEWS.withdrawals = async () => {
    const { data, error } = await sb.from('withdrawals').select('*, user:profiles!withdrawals_user_id_fkey(username,quests_done,created_at), first:profiles!withdrawals_first_approver_fkey(username)')
      .in('status', ['pending', 'second_approval']).order('created_at');
    if (error) throw error;
    const dual = Number(S.settings.withdraw_dual_threshold || 5000), rate = parseFloat(S.settings.gold_thb_rate);
    const total = data.reduce((a, w) => a + Number(w.amount_gold), 0);
    const edit = can('m.withdraw');
    $('content').innerHTML = `
      <div><h1 style="font-size:28px">อนุมัติถอนเงิน</h1><p class="muted" style="margin:4px 0 0">ตั้งแต่ ${num(dual)} G ต้องมีผู้อนุมัติ 2 คน · อนุมัติแล้วให้โอนเงินจริงนอกระบบตามบัญชีที่ผู้ใช้ยืนยัน</p></div>
      <div class="kpis"><div class="card kpi"><div class="small muted">รอตัดสิน</div><div class="v" style="color:var(--gold-ink)">${num(total)} G</div><div class="small muted">${data.length} คำขอ${rate > 0 ? ' · ≈ ' + (total * rate).toLocaleString('th-TH') + ' บาท' : ''}</div></div></div>
      ${data.length ? `<div class="tbl-wrap"><table style="min-width:760px"><thead><tr><th>ผู้ใช้</th><th style="text-align:right">จำนวน</th><th>บัญชี</th><th>สถานะ</th><th></th></tr></thead><tbody>
      ${data.map((w) => {
        const big = Number(w.amount_gold) >= dual, mine = w.user_id === S.user.id, sameFirst = w.first_approver === S.user.id;
        const st = w.status === 'second_approval' ? `รอคนที่ 2 · คนแรก @${esc(w.first && w.first.username)}` : big ? 'รอคนที่ 1 (ยอดสูง)' : 'รออนุมัติ';
        const btns = !edit ? '' : mine ? '<span class="small muted">คำขอของคุณเอง</span>' : sameFirst ? '<span class="small muted">รอคนอื่นยืนยัน</span>'
          : `<div class="row" style="justify-content:flex-end"><button class="btn action" data-wd="${w.id}" data-ok="1">${w.status === 'second_approval' ? 'ยืนยันคนที่ 2' : 'อนุมัติ'}</button><button class="btn sec" data-wd="${w.id}" data-ok="0">ปฏิเสธ</button></div>`;
        return `<tr><td><b>@${esc(w.user && w.user.username)}</b><br><span class="small muted">บัญชี ${w.user ? ageDays(w.user.created_at) : '?'} วัน · ${w.user ? num(w.user.quests_done) : 0} เควสต์</span></td>
          <td class="gold" style="text-align:right">${num(w.amount_gold)} G${rate > 0 ? `<br><span class="small muted" style="font-family:var(--font-body);font-weight:400">≈ ${(w.amount_gold * rate).toLocaleString('th-TH')} บาท</span>` : ''}</td>
          <td>${esc(w.bank_label)}<br><span class="small muted">${when(w.created_at)}</span></td><td class="small" style="font-weight:600">${st}</td><td>${btns}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="empty">ไม่มีคำขอถอนค้าง</div>'}`;
  };

  VIEWS.guilds = async () => {
    const [{ data: claims, error }, { data: guilds }, { data: mem }] = await Promise.all([
      sb.from('guild_claims').select('*, claimant:profiles!guild_claims_claimant_id_fkey(username,quests_done,created_at), guild:guilds(name,fund_gold)')
        .eq('status', 'approved').order('decided_at'),
      sb.from('guilds').select('*').is('closed_at', null).order('fund_gold', { ascending: false }).limit(100),
      sb.from('guild_members').select('guild_id').is('left_at', null)
    ]);
    if (error) throw error;
    const cnt = {}; (mem || []).forEach((m) => { cnt[m.guild_id] = (cnt[m.guild_id] || 0) + 1; });
    const edit = can('g.fund');
    const hl = (g) => { const p = Math.round((Number(g.fund_gold) / ((cnt[g.id] || 1) * 500)) * 100); return p >= 50 ? ['มั่นคง', 'var(--teal-tint)', 'var(--teal-ink)'] : p >= 20 ? ['ระวัง', '#f6e8cf', '#7a4a06'] : ['เสี่ยง', 'var(--danger-tint)', 'var(--danger-ink)']; };
    $('content').innerHTML = `
      <div><h1 style="font-size:28px">กิลด์และกองทุน</h1><p class="muted" style="margin:4px 0 0">เคลมด้านล่างผ่านโหวตสมาชิกกิลด์แล้ว ตรวจเหตุผลก่อนจ่าย — จ่ายแล้วเงินออกจากกองทุนเข้ากระเป๋าผู้เคลม</p></div>
      <h2 style="font-size:17px">เคลมรอจ่าย</h2>
      ${claims.length ? `<div class="tbl-wrap"><table style="min-width:720px"><thead><tr><th>กิลด์</th><th>ผู้เคลม</th><th>เหตุผล</th><th style="text-align:right">จำนวน</th><th>โหวต</th><th></th></tr></thead><tbody>
      ${claims.map((c) => `<tr><td><b>${esc(c.guild && c.guild.name)}</b><br><span class="small muted">กองทุน ${num(c.guild && c.guild.fund_gold)} G</span></td>
        <td>@${esc(c.claimant && c.claimant.username)}<br><span class="small muted">บัญชี ${c.claimant ? ageDays(c.claimant.created_at) : '?'} วัน</span></td>
        <td>${esc(c.reason)}</td><td class="gold" style="text-align:right">${num(c.amount)} G</td><td class="small">${c.yes_votes} เห็นด้วย / ${c.no_votes} ไม่</td>
        <td>${edit ? `<div class="row" style="justify-content:flex-end"><button class="btn action" data-gc="${c.id}" data-pay="1">จ่าย</button><button class="btn sec" data-gc="${c.id}" data-pay="0">ไม่จ่าย</button></div>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">ไม่มีเคลมรอจ่าย</div>'}
      <h2 style="font-size:17px">กิลด์ทั้งหมด</h2>
      ${guilds && guilds.length ? `<div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th>กิลด์</th><th>สมาชิก</th><th style="text-align:right">กองทุน</th><th>สถานะ</th><th>ตั้งเมื่อ</th></tr></thead><tbody>
      ${guilds.map((g) => { const [l, bg, fg] = hl(g); return `<tr><td><b>${esc(g.name)}</b><br><span class="small muted">${esc(g.motto || '')}</span></td><td>${cnt[g.id] || 0}/${g.member_cap}</td>
        <td class="gold" style="text-align:right">${num(g.fund_gold)} G</td><td><span class="tag" style="background:${bg};color:${fg}">${l}</span></td><td class="small muted">${when(g.created_at)}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty">ยังไม่มีกิลด์</div>'}`;
  };

  VIEWS.settings = async () => {
    const { data } = await sb.from('app_settings').select('key,value,updated_at').order('key');
    S.settings = Object.fromEntries((data || []).map((r) => [r.key, r.value]));
    const L = { gold_thb_rate: ['อัตรา Gold ต่อบาท', '1 G = ? บาท (เช่น 0.25)'], signup_bonus_gold: ['โบนัสสมัครใหม่ (G)', 'Gold ที่ผู้ใช้ใหม่ได้ทันที'],
      review_reward_threshold: ['เควสต์ต้องตรวจเมื่อรางวัลตั้งแต่ (G)', ''], withdraw_min_gold: ['ถอนขั้นต่ำ (G)', ''], withdraw_dual_threshold: ['ถอนตั้งแต่ยอดนี้ต้องอนุมัติ 2 คน (G)', ''] };
    const edit = can('m.rate');
    $('content').innerHTML = `<h1 style="font-size:28px">เศรษฐกิจ · อัตรา Gold</h1>
      <div class="kpis">${(data || []).map((r) => `<form class="card" data-setting="${esc(r.key)}" style="display:flex;flex-direction:column;gap:8px">
        <label class="f">${esc((L[r.key] || [r.key])[0])}<input name="v" value="${esc(r.value)}" ${edit ? '' : 'readonly'} placeholder="${esc((L[r.key] || ['', ''])[1])}"></label>
        <span class="small muted">แก้ล่าสุด ${when(r.updated_at)}</span>${edit ? '<button class="btn sec" type="submit">บันทึก</button>' : ''}</form>`).join('')}</div>
      <p class="small muted" style="margin:0">การเปลี่ยนค่าทุกครั้งถูกบันทึกในบันทึกการตรวจสอบ</p>`;
  };

  VIEWS.staff = async () => {
    const { data, error } = await sb.from('staff_members').select('user_id, role_id, added_at, p:profiles!staff_members_user_id_fkey(username,display_name)').order('added_at');
    if (error) throw error;
    const { data: roles } = await sb.from('staff_roles').select('*').order('sort');
    const opts = (cur) => (roles || []).map((r) => `<option value="${r.id}" ${r.id === cur ? 'selected' : ''}>${esc(r.label)}</option>`).join('');
    const edit = can('s.roles');
    $('content').innerHTML = `<h1 style="font-size:28px">ทีมงาน</h1>
      ${edit ? `<form id="addStaff" class="card row" style="align-items:flex-end">
        <label class="f" style="flex:1 1 200px">ชื่อผู้ใช้ (ไม่ต้องใส่ @)<input name="u" required pattern="[A-Za-z0-9_]{3,20}"></label>
        <label class="f">บทบาท<select name="r">${opts('support')}</select></label>
        <button class="btn primary" type="submit">เพิ่มเข้าทีม</button></form>` : ''}
      <div class="tbl-wrap"><table style="min-width:520px"><thead><tr><th>ผู้ใช้</th><th>บทบาท</th><th>เพิ่มเมื่อ</th><th></th></tr></thead><tbody>
      ${data.map((s) => `<tr><td><b>${esc(s.p && (s.p.display_name || s.p.username))}</b><br><span class="small muted">@${esc(s.p && s.p.username)}</span></td>
        <td>${edit ? `<select data-staff-role="${s.user_id}" aria-label="บทบาทของ ${esc(s.p && s.p.username)}" style="border:1.5px solid var(--brass-600);border-radius:8px;padding:6px">${opts(s.role_id)}</select>` : esc(s.role_id)}</td>
        <td class="small muted">${when(s.added_at)}</td><td style="text-align:right">${edit && s.user_id !== S.user.id ? `<button class="btn sec" data-staff-remove="${s.user_id}">นำออก</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>`;
  };

  VIEWS.roles = async () => {
    const [{ data: roles }, { data: perms }, { data: rp }] = await Promise.all([
      sb.from('staff_roles').select('*').order('sort'), sb.from('permissions').select('*').order('sort'), sb.from('role_permissions').select('*')]);
    const lv = {}; (rp || []).forEach((r) => { lv[r.role_id + ':' + r.permission_id] = r.level; });
    const edit = can('s.roles');
    let grp = '';
    const body = perms.map((p) => {
      const head = p.grp !== grp ? `<tr><th colspan="${roles.length + 1}" style="font-family:var(--font-display);font-size:14px;color:var(--ink-soft);padding-top:16px">${esc(p.grp)}</th></tr>` : '';
      grp = p.grp;
      return head + `<tr><td>${esc(p.label)}<br><span class="small muted">${esc(p.id)}</span></td>${roles.map((r) => {
        const v = lv[r.id + ':' + p.id] === 'full' ? 'F' : lv[r.id + ':' + p.id] === 'view' ? 'V' : 'N';
        const word = { F: 'เต็ม', V: 'ดูอย่างเดียว', N: 'ไม่มีสิทธิ์' }[v];
        const locked = !edit || r.id === 'owner';
        return `<td style="text-align:center"><button class="cell ${v}" data-cell="${r.id}|${p.id}|${v}" ${locked ? 'disabled' : ''} aria-label="${esc(r.label)} · ${esc(p.label)}: ${word}">${{ F: '✓', V: '◐', N: '–' }[v]}</button></td>`;
      }).join('')}</tr>`;
    }).join('');
    $('content').innerHTML = `<div><h1 style="font-size:28px">บทบาทและสิทธิ์</h1><p class="muted" style="margin:4px 0 0">${edit ? 'กดที่ช่องเพื่อสลับ เต็ม → ดูอย่างเดียว → ไม่มี · มีผลทันที' : 'ดูได้อย่างเดียว'} · คอลัมน์เจ้าของระบบล็อกไว้</p></div>
      <div class="tbl-wrap"><table style="min-width:720px"><thead><tr><th>สิทธิ์</th>${roles.map((r) => `<th style="text-align:center;color:var(--ink)">${esc(r.label)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
  };

  VIEWS.audit = async () => {
    const { data, error } = await sb.from('audit_log').select('*').order('created_at', { ascending: false }).limit(80);
    if (error) throw error;
    const ids = [...new Set(data.map((a) => a.actor).filter(Boolean))];
    const names = {};
    if (ids.length) { const { data: ps } = await sb.from('profiles').select('id,username').in('id', ids); (ps || []).forEach((p) => { names[p.id] = p.username; }); }
    $('content').innerHTML = `<h1 style="font-size:28px">บันทึกการตรวจสอบ</h1>
      ${data.length ? `<div class="tbl-wrap"><table style="min-width:640px"><thead><tr><th>เมื่อ</th><th>ใคร</th><th>ทำอะไร</th><th>เป้าหมาย</th><th>รายละเอียด</th></tr></thead><tbody>
      ${data.map((a) => `<tr><td class="small muted" style="white-space:nowrap">${when(a.created_at)}</td><td>@${esc(names[a.actor] || '?')}</td><td><b>${esc(a.action)}</b></td><td class="small">${esc(a.target_type)} ${esc((a.target_id || '').slice(0, 8))}</td><td class="small muted">${esc(a.detail ? JSON.stringify(a.detail) : '')}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">ยังไม่มีบันทึก</div>'}`;
  };

  /* ---------- Actions ---------- */
  $('content').addEventListener('click', async (ev) => {
    const t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.qtab) { S.qTab = t.dataset.qtab; S.selQuest = null; return reload(); }
    if (t.dataset.pick) { S.selQuest = t.dataset.pick; return reload(); }
    if (t.dataset.mod) {
      const d = t.dataset.mod, note = ($('modNote') && $('modNote').value.trim()) || null;
      if (d === 'suspend' && !confirm('ระงับเควสต์นี้และคืน Gold ให้ผู้โพสต์?')) return;
      if (d === 'changes' && !note) return toast('ใส่หมายเหตุว่าต้องแก้อะไร', true);
      t.disabled = true;
      const ok = await rpc('moderate_quest', { p_quest: S.selQuest, p_decision: d, p_note: note }, { approve: 'อนุมัติแล้ว เควสต์ขึ้นกระดาน', changes: 'ส่งคำขอแก้ไขแล้ว', suspend: 'ระงับแล้ว คืน Gold แล้ว' }[d]);
      if (ok) { S.selQuest = null; reload(); } else t.disabled = false;
      return;
    }
    if (t.dataset.resolve) { t.disabled = true; if (await rpc('resolve_report', { p_report: Number(t.dataset.resolve) }, 'ปิดเคสแล้ว')) reload(); else t.disabled = false; return; }
    if (t.dataset.wd) {
      const approve = t.dataset.ok === '1';
      if (!approve && !confirm('ปฏิเสธคำขอนี้? Gold จะคืนให้ผู้ใช้')) return;
      t.disabled = true;
      const r = await rpc('decide_withdrawal', { p_id: t.dataset.wd, p_approve: approve, p_note: null },
        (s) => ({ paid: 'อนุมัติแล้ว — โอนเงินจริงให้ผู้ใช้ได้เลย', second_approval: 'บันทึกแล้ว รอผู้อนุมัติคนที่ 2', rejected: 'ปฏิเสธแล้ว คืน Gold แล้ว' }[s] || s));
      if (r) reload(); else t.disabled = false;
      return;
    }
    if (t.dataset.gc) {
      const pay = t.dataset.pay === '1';
      if (!confirm(pay ? 'จ่ายเคลมนี้จากกองทุนกิลด์?' : 'ไม่จ่ายเคลมนี้? เงินจะคงอยู่ในกองทุน')) return;
      t.disabled = true;
      if (await rpc('decide_guild_claim', { p_claim: t.dataset.gc, p_pay: pay }, pay ? 'จ่ายเคลมแล้ว' : 'ปฏิเสธเคลมแล้ว')) reload(); else t.disabled = false;
      return;
    }
    if (t.dataset.cell) {
      const [role, perm, v] = t.dataset.cell.split('|'); const next = { F: 'view', V: 'none', N: 'full' }[v];
      t.disabled = true;
      if (await rpc('set_role_permission', { p_role: role, p_perm: perm, p_level: next })) {
        if (role === S.role) { const { data: rp } = await sb.from('role_permissions').select('permission_id, level').eq('role_id', S.role); S.perms = Object.fromEntries((rp || []).map((r) => [r.permission_id, r.level])); }
        reload();
      } else t.disabled = false;
      return;
    }
    if (t.dataset.staffRemove) {
      if (!confirm('นำผู้ใช้นี้ออกจากทีมงาน?')) return;
      if (await rpc('assign_staff', { p_user: t.dataset.staffRemove, p_role: null }, 'นำออกแล้ว')) reload();
    }
  });
  $('content').addEventListener('change', async (ev) => {
    const s = ev.target.closest('select[data-staff-role]'); if (!s) return;
    if (await rpc('assign_staff', { p_user: s.dataset.staffRole, p_role: s.value }, 'เปลี่ยนบทบาทแล้ว')) reload(); else reload();
  });
  $('content').addEventListener('submit', async (ev) => {
    const f = ev.target; ev.preventDefault();
    if (f.dataset.setting) { if (await rpc('set_setting', { p_key: f.dataset.setting, p_value: f.v.value.trim() }, 'บันทึกแล้ว')) reload(); return; }
    if (f.id === 'addStaff') {
      const { data: p } = await sb.from('profiles').select('id').eq('username', f.u.value.trim()).maybeSingle();
      if (!p) return toast('ไม่พบชื่อผู้ใช้นี้', true);
      if (await rpc('assign_staff', { p_user: p.id, p_role: f.r.value }, 'เพิ่มเข้าทีมแล้ว')) reload();
    }
  });
})();
</script>
</body>
</html>
